name: CI Pipeline

on:
  push:
    branches:
      - main
      - codex/*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-jobs-app:
    name: Typecheck, Test & Build (jobs-app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobs-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: jobs-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Typecheck and Build
        env:
          VITE_SUPABASE_URL: https://tcbdvssujsjrexddcrgc.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key-for-ci-build
        run: npm run build
